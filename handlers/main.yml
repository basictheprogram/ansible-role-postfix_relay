---
- name: Restart postfix
  ansible.builtin.service:
    name: "postfix"
    state: "restarted"
  tags: postfix_relay

- name: Reload postfix
  ansible.builtin.service:
    name: "postfix"
    state: "reloaded"
  tags: postfix_relay

- name: Newaliases
  ansible.builtin.command: "/usr/bin/newaliases"
  changed_when: true
  tags: postfix_relay

- name: Restart dovecot
  ansible.builtin.service:
    name: "dovecot"
    state: "restarted"
  tags: postfix_relay

- name: Reload dovecot
  ansible.builtin.service:
    name: "dovecot"
    state: "reloaded"
  tags: postfix_relay

- name: Update ca-certificates
  ansible.builtin.command: "/usr/sbin/update-ca-certificates"
  register: r
  changed_when: true
  tags: postfix_relay

- name: Postmap
  ansible.builtin.command: "/usr/sbin/postmap {{ postfix_relay_item }}"
  args:
    chdir: /etc/postfix/
  register: r
  changed_when: true
  loop:
    - "login_map"
    - "relay_domains"
  loop_control:
    loop_var: postfix_relay_item
  tags: postfix_relay

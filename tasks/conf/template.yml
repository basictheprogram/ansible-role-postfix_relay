---
- name: Install postfix main configuration via template
  ansible.builtin.template:
    src: main_cf.j2
    dest: /etc/postfix/main.cf
    owner: root
    group: root
    mode: 0644
  notify:
    - Update ca-certificates
    - Restart postfix
  tags: postfix_relay

- name: Debug
  ansible.builtin.debug:
    var: postfix_conf.mynetworks_conf
  tags: postfix_relay


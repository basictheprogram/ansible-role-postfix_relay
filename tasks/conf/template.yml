- name: Configure mynetworks (file)
  ansible.builtin.copy:
    src: "{{ postfix_conf.mynetworks }}"
    dest: /etc/postfix/mynetworks
    owner: root
    group: root
    mode: 0644
  when:
    - postfix_conf.mynetworks_conf is defined
    - postfix_conf.mynetworks_conf == 'file'
  notify:
    - Postmap
    - Reload postfix
  tags: postfix_relay

- name: Configure relay_domains (file)
  ansible.builtin.copy:
    src: "{{ postfix_conf.relay_domains }}"
    dest: /etc/postfix/relay_domains
    owner: root
    group: root
    mode: 0644
  when:
    - postfix_conf.relay_domains is defined
    - postfix_conf.relay_domains_conf == 'file'
  notify:
    - Postmap
    - Reload postfix
  tags: postfix_relay


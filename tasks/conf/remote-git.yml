---
- name: Check if postfix configuration under git
  ansible.builtin.stat:
    path: /etc/postfix/.git
  register: st
  tags: postfix_relay

- name: Move non-git controlled postfix configuration
  ansible.builtin.command: "mv /etc/postfix /tmp/postfix.old"
  when: st.stat.isdir is not defined
  tags: postfix_relay

- name: Deploy postfix configuration via git
  ansible.builtin.git:
    repo: "{{ postfix_repository }}"
    dest: "/etc/postfix"
    accept_hostkey: "yes"
    clone: "yes"
    recursive: "yes"
    update: "yes"
    version: "{{ postfix_branch }}"
  register: git_result
  notify:
    - rebuild db
    - restart postfix
  tags: postfix_relay
